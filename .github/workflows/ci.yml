name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sourcing
          POSTGRES_PASSWORD: sourcing
          POSTGRES_DB: sourcing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcing -d sourcing_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sourcing:sourcing@localhost:5432/sourcing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v --cov --cov-report=term
