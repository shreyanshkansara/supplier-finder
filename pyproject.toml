[project]
name = "sourcing-agent"
version = "0.4.0"
description = "Supplier discovery agent: FastAPI + Postgres/pgvector + LangGraph + Gemini + Jev. Returns the vendors that can supply a requirement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "google-genai>=2.25,<3",
    "typesafe-sdk>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs DB code inside greenlets; without this those lines look uncovered
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a running Postgres with pgvector (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/File() defaults are the idiom. E501: long lines are left to the formatter.
ignore = ["B008", "E501"]
